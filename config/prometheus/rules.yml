groups:
  - name: orion_slo_recording
    interval: 10s
    rules:
      - record: job:traefik_requests:rate5m
        expr: sum(rate(traefik_service_requests_total{service="rag@file", code!="429"}[5m]))

      # Ratio erreurs 5xx / total requetes hors 429 sur 8m
      - record: job:traefik_errors:ratio_rate8m
        expr: |
          (
            sum(rate(traefik_service_requests_total{service="rag@file", code=~"5.."}[8m]))
            or vector(0)
          )
          /
          sum(rate(traefik_service_requests_total{service="rag@file", code!="429"}[8m]))

      # Meme ratio sur fenetre courte de 40s (avec vector(0) si pas de 5xx)
      - record: job:traefik_errors:ratio_rate40s
        expr: |
          (
            sum(rate(traefik_service_requests_total{service="rag@file", code=~"5.."}[40s]))
            or vector(0)
          )
          /
          sum(rate(traefik_service_requests_total{service="rag@file", code!="429"}[40s]))

      - record: job:orion_gateway_latency_p95:5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(gateway_request_duration_seconds_bucket[5m]))
          )

      - record: backend:orion_gateway_latency_p95:5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, backend) (rate(gateway_request_duration_seconds_bucket[5m]))
          )

      - record: job:orion_quality_good_ratio:rate15m
        expr: |
          sum(rate(quality_reference_checks_total{result="good"}[15m]))
          /
          clamp_min(sum(rate(quality_reference_checks_total[15m])), 1e-9)

  - name: orion_slo_alerts
    interval: 10s
    rules:
      # Alerte burn rate multi-fenetres (8m et 40s) a 14.4x sur le budget d'erreur 0.5%
      - alert: OrionSLODisponibiliteBurnRatePage
        expr: |
          job:traefik_errors:ratio_rate8m > (14.4 * 0.005)
          and
          job:traefik_errors:ratio_rate40s > (14.4 * 0.005)
          and
          sum(increase(traefik_service_requests_total{service="rag@file", code!="429"}[40s])) >= 10
        keep_firing_for: 2m
        labels:
          severity: page
          slo: availability
          service: orion-rag
        annotations:
          summary: "Consommation rapide du budget d'erreur de disponibilité d'Orion (burn rate > 14,4x)"
          description: "Le taux d'erreur 5xx hors 429 dépasse le seuil de burn rate rapide sur 8 min et 40 s."

      - alert: OrionSLOLatencePage
        expr: |
          (
            histogram_quantile(0.95, sum by (le, backend) (rate(gateway_request_duration_seconds_bucket{backend="ollama"}[5m]))) > 12
            and
            sum by (backend) (increase(gateway_request_duration_seconds_count{backend="ollama"}[5m])) >= 5
          )
          or
          (
            histogram_quantile(0.95, sum by (le, backend) (rate(gateway_request_duration_seconds_bucket{backend="simule"}[5m]))) > 2.5
            and
            sum by (backend) (increase(gateway_request_duration_seconds_count{backend="simule"}[5m])) >= 20
          )
        for: 2m
        labels:
          severity: page
          slo: latency
          service: orion-gateway
        annotations:
          summary: "Dépassement du SLO de latence p95 sur le backend {{ $labels.backend }}"
          description: "La latence p95 sur 5 min dépasse le seuil du SLO (12 s pour ollama, 2,5 s pour simule)."

      - alert: OrionSLOQualiteTicket
        expr: |
          (
            sum(rate(quality_reference_checks_total{result="bad"}[15m]))
            /
            sum(rate(quality_reference_checks_total[15m]))
          ) > 0.10
          and
          sum(increase(quality_reference_checks_total[15m])) >= 5
        for: 2m
        labels:
          severity: ticket
          slo: quality
          service: orion-rag
        annotations:
          summary: "Dégradation du SLO de qualité sur les questions de référence (< 90 %)"
          description: "Plus de 10 % des contrôles synthétiques de référence ont échoué sur les 15 dernières minutes."

      - alert: OrionQuotaEquipeRejetsTicket
        expr: sum by (team) (increase(gateway_quota_rejections_total[5m])) >= 10
        for: 1m
        labels:
          severity: ticket
          service: orion-gateway
        annotations:
          summary: "Rejets de quota (HTTP 429) pour l'équipe {{ $labels.team }}"
          description: "Au moins 10 requêtes de l'équipe {{ $labels.team }} ont été rejetées pour dépassement de quota sur 5 min."

      - alert: OrionAbsenceDeTraficPage
        expr: |
          absent(traefik_service_requests_total{service="rag@file"})
          or
          sum(rate(traefik_service_requests_total{service="rag@file"}[5m])) == 0
          or
          probe_success{job="blackbox"} == 0
        for: 2m
        labels:
          severity: page
          service: orion-rag
        annotations:
          summary: "Absence de trafic ou échec de la sonde HTTPS sur Traefik"
          description: "Aucune requête n'est observée sur le service rag@file depuis 5 min ou la sonde blackbox HTTPS échoue."

      # Obs : cycle du worker ~60s avec pic max a ~75s en nominal.
      # Seuil a 150s (~2x le pic max) + confirmation for: 1m pour eviter les faux positifs si un cycle lag.
      # Declenchement sous les 4 min en cas de blocage (~3m30).
      - alert: OrionWorkerFraicheurIndexationTicket
        expr: (time() - worker_last_success_timestamp_seconds) > 150
        for: 1m
        labels:
          severity: ticket
          service: orion-worker
        annotations:
          summary: "Arrêt de l'indexation documentaire du worker (fraîcheur > 150s)"
          description: "Le worker d'indexation n'a pas terminé de cycle réussi depuis plus de 150s."

      # Alerte predictive : risque de saturation de la base audit (> 50 Mo sous 4h)
      - alert: OrionAuditDatabaseSaturationPredite
        expr: |
          predict_linear(pg_database_size_bytes{datname="orion_audit"}[10m], 4 * 3600) > 50000000
          and
          pg_database_size_bytes{datname="orion_audit"} < 50000000
        for: 2m
        labels:
          severity: ticket
          service: postgres-db
        annotations:
          summary: "Saturation predite de la base orion_audit (> 50 Mo sous 4h)"
          description: "La projection lineaire a 4h depasse la capacite max de 50 Mo."
