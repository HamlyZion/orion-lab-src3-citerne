global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: false
  insecure: false

entryPoints:
  websecure:
    address: ":443"
  metrics:
    address: ":8082"

providers:
  file:
    filename: "/etc/traefik/dynamic.yml"
    watch: true

metrics:
  prometheus:
    entryPoint: "metrics"
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    buckets:
      - 0.05
      - 0.1
      - 0.25
      - 0.5
      - 1.0
      - 2.0
      - 5.0
      - 10.0
      - 20.0
      - 30.0
      - 40.0

tracing:
  serviceName: "traefik"
  otlp:
    grpc:
      endpoint: "alloy:4317"
      insecure: true

accessLog:
  format: "json"
