modules:
  http_2xx_tls:
    prober: http
    timeout: 5s
    http:
      valid_http_versions:
        - "HTTP/1.1"
        - "HTTP/2.0"
      valid_status_codes:
        - 200
      method: GET
      fail_if_not_ssl: true
      preferred_ip_protocol: "ip4"
      tls_config:
        ca_file: "/etc/blackbox/certs/ca.crt"
        insecure_skip_verify: false
