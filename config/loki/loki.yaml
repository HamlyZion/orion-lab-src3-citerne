auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Vidage des chunks pour contenir l'empreinte mémoire (cible 512 Mo) ;
# un flux qui ne reçoit plus de ligne reste actif pendant chunk_idle_period
ingester:
  chunk_idle_period: 30m
  max_chunk_age: 30m
  chunk_target_size: 1048576
  chunk_retain_period: 30s
  chunk_block_size: 131072
  wal:
    enabled: true
    dir: /loki/wal
    replay_memory_ceiling: 256MB

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  reject_old_samples: true
  reject_old_samples_max_age: 24h
  max_global_streams_per_user: 1000
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  retention_period: 24h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 1h
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
